<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Iraq Youth Scientist Team</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="images/favicon.jpg">
</head>
<body>
<header>
    <!-- Logo and Text Container -->
    <div class="logo-container">
        <div class="logo">
            <img src="images/logo.jpeg" alt="Iraq Youth Scientist Team Logo">
        </div>
        <div class="logo-text">
            Iraq Youth Scientists Team
        </div>
    </div>

    <!-- Hamburger Menu Icon -->
    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <!-- Navigation Menu -->
    <nav id="navMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="programs.html">Program</a></li>
            <li><a href="news.html">News</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="mentors.html">Mentors</a></li>
        </ul>
    </nav>
</header>

   <section class="contact">
        <h1>Contact Us</h1>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2023 Iraq Youth Scientist Team. All rights reserved.</p>
    </footer>

    <script src="js/scripts.js"></script>
</body>
</html>
